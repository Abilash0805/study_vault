<!DOCTYPE html>
<html lang="en" class="booting">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checkout — StudyVault</title>
<meta name="robots" content="noindex">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6d5ef9">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div id="boot"><div class="spinner"></div><span class="boot-text">Loading…</span></div>

<div id="site-header"></div>

<main class="page page-narrow">
  <div class="page-head">
    <h1>Checkout</h1>
    <p>Review your order.</p>
  </div>
  <div id="content"></div>
</main>

<script type="module">
import { requireAuth, doSignOut, grantedIds } from './assets/js/session.js';
import { listMaterials } from './assets/js/content.js';
import { mountChrome, ready, el, fill, fmtMoney, emptyState, setCartCount } from './assets/js/ui.js';
import * as cart from './assets/js/cart.js';

const { user, isAdmin, student } = await requireAuth();
mountChrome({ active: 'cart', user, isAdmin, onSignOut: () => doSignOut() });
cart.onChange(setCartCount);

const contentEl = document.getElementById('content');

try {
  const all = await listMaterials();
  const byId = Object.fromEntries(all.map(m => [m.id, m]));
  const owned = grantedIds(isAdmin, student) || new Set(all.map(m => m.id));

  const sellable = new Set(
    all.filter(m => m.published && m.pricePaise !== null && !owned.has(m.id)).map(m => m.id)
  );
  cart.prune(sellable);

  const ids = cart.items();
  if (!ids.length) {
    fill(contentEl, emptyState('🛒', 'Your cart is empty', 'Add something from the store first.'));
    contentEl.append(el('div', { style: 'text-align:center' },
      el('a', { class: 'btn btn-primary', href: 'store.html' }, 'Go to the store')));
  } else {
    const lines = ids.map(id => byId[id]).filter(Boolean);
    fill(contentEl,
      el('div', { class: 'card' },
        el('h2', {}, 'Order summary'),
        ...lines.map(m => el('div', { class: 'summary-row' },
          el('span', { class: 'truncate' }, m.title),
          el('span', {}, m.pricePaise ? fmtMoney(m.pricePaise) : 'Free')
        )),
        el('div', { class: 'summary-total' },
          el('span', {}, 'Total'),
          el('span', {}, fmtMoney(cart.total(byId, ids)))
        )
      ),
      el('div', { class: 'card' },
        el('h2', {}, '💳 Payment'),
        el('p', { class: 'card-sub' },
          'UPI payment is not switched on yet. Your cart is saved — come back once ' +
          'payment is enabled, or contact your instructor to be granted access directly.'),
        el('a', { class: 'btn btn-secondary', href: 'cart.html' }, '← Back to cart')
      )
    );
  }
} catch (e) {
  console.error('checkout:', e);
  fill(contentEl, emptyState('⚠️', 'Could not load your order', e.message));
} finally {
  ready();
}
</script>
</body>
</html>
